<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Vegas 2026 | Itinerary</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf1f7;background:#0b1020}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#242045,#101827 60%,#503044);padding:48px max(20px,calc((100vw - 820px)/2)) 38px}h1{font-size:clamp(42px,8vw,70px);margin:4px 0}header p{color:#cbd5e1}main{max-width:820px;margin:auto;padding:24px 16px 64px}.eyebrow{letter-spacing:.18em;color:#c4a6ff;font-weight:700;font-size:12px;text-transform:uppercase}.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 26px}.days button{cursor:pointer;border:1px solid #38425b;background:#1a2235;color:#e2e8f0;border-radius:12px;padding:14px 2px;font:inherit}.days button[aria-selected=true]{background:#6d4ac3;border-color:#aa8cff;color:white}.days small{display:block;font-size:11px;opacity:.8}.days b{display:block;font-size:23px}.panel{background:#141d30;border:1px solid #344056;border-radius:18px;padding:24px}h2{margin:0 0 5px;font-size:27px}.subtitle{color:#9daec8;margin:0 0 25px}.event{display:grid;grid-template-columns:100px 1fr;gap:16px;border-top:1px solid #303c50;padding:20px 0}.time{font-size:13px;color:#c4a6ff;font-weight:700}.event h3{font-size:17px;margin:0 0 6px}.event p{margin:0;color:#aebbd0;font-size:14px}.free h3{color:#b3bfd1;font-weight:500}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.nav button{padding:12px 20px;background:#29354e;color:white;border:1px solid #495873;border-radius:10px;cursor:pointer}.nav button:disabled{opacity:.3;cursor:default}footer{margin-top:25px;color:#93a2bb;font-size:13px}@media(max-width:500px){.days{gap:4px}.days button{padding:12px 0}.days b{font-size:19px}.panel{padding:17px}.event{grid-template-columns:82px 1fr;gap:8px}}</style></head><body><header><div class="eyebrow">Trip itinerary · 2026</div><h1>Las Vegas</h1><p>24–29 November · 2 travellers · All times local</p></header><main><div class="eyebrow">Browse your days</div><nav class="days" id="days" aria-label="Choose day"></nav><section class="panel" aria-live="polite"><h2 id="heading"></h2><p class="subtitle" id="subtitle"></p><div id="events"></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></section><footer>Only known bookings and transfers are listed. Unscheduled time is deliberately left as downtime. Times marked TBD have not been confirmed.</footer></main><script>const days=[["Tue 24 Nov","Arrival",[["5:50 PM","Arrive Las Vegas","Aer Lingus EI0051 · Dublin → Las Vegas"],["TBD","Transfer to Cosmopolitan","Transport not arranged"],["TBD","Cosmopolitan check-in","Night 1 of 2"],["Rest of day","Downtime — no plans",""]]],["Wed 25 Nov","Cosmopolitan",[["All day","Downtime — no plans","Cosmopolitan · night 2 of 2"]]],["Thu 26 Nov","Hotel change",[["TBD","Cosmopolitan check-out",""],["TBD","Uber to Flamingo","Cosmopolitan → Flamingo"],["TBD","Flamingo check-in","Night 1 of 2"],["Rest of day","Downtime — no plans",""]]],["Fri 27 Nov","Eagles at Sphere",[["Before 7 PM","Downtime — no plans",""],["7:00 PM","Sphere doors open",""],["8:30 PM","Eagles concert begins","Sphere · end time not confirmed"],["11:15 PM","CHICA dinner reservation","The Venetian · 2 guests · confirmed"]]],["Sat 28 Nov","Departure",[["TBD","Flamingo check-out",""],["Until departure","Downtime — no plans",""],["TBD","Transfer to airport","Not arranged"],["7:35 PM","Aer Lingus EI0050 departs","Las Vegas → Dublin"]]],["Sun 29 Nov","Home",[["1:20 PM","Arrive Dublin","Aer Lingus EI0050"]]]];let selected=0;const el=id=>document.getElementById(id);function render(){el('days').innerHTML=days.map((d,i)=>'<button aria-selected="'+(i===selected)+'" data-i="'+i+'"><small>'+d[0].split(' ')[0]+'</small><b>'+d[0].split(' ')[1]+'</b></button>').join('');el('heading').textContent=days[selected][0];el('subtitle').textContent=days[selected][1];el('events').innerHTML=days[selected][2].map(e=>'<div class="event '+(e[1].startsWith('Downtime')?'free':'')+'"><div class="time">'+e[0]+'</div><div><h3>'+e[1]+'</h3>'+(e[2]?'<p>'+e[2]+'</p>':'')+'</div></div>').join('');el('prev').disabled=selected===0;el('next').disabled=selected===days.length-1;el('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;render()})}el('prev').onclick=()=>{selected--;render()};el('next').onclick=()=>{selected++;render()};render();</script></body></html>
